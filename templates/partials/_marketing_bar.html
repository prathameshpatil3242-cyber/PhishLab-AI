{# Marketing header used by the public pages (login, sign-up, pricing). #}
<header class="topbar mkt-bar">
  <button class="icon-btn" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>

  <a class="mkt-brand" href="{{ url_for('dashboard' if current_user.is_authenticated else 'pricing_page') }}">
    <span class="brand-mark" aria-hidden="true">&#9670;</span>
    <span class="brand-text">PHISHLAB <em>AI</em></span>
  </a>

  <nav class="mkt-nav" aria-label="Product">
    <a class="mkt-link" href="{{ url_for('pricing_page') }}">Pricing</a>
    <a class="mkt-link" href="{{ url_for('learning_page') }}">Learning centre</a>
    <a class="mkt-link" href="{{ url_for('about_page') }}">About</a>
  </nav>

  <div class="topbar-right">
    {% if current_user.is_authenticated %}
      <a class="btn btn-ghost btn-sm" href="{{ url_for('dashboard') }}">Dashboard</a>
    {% else %}
      <a class="btn btn-ghost btn-sm" href="{{ url_for('login_page') }}">Log in</a>
      <a class="btn btn-primary btn-sm" href="{{ url_for('signup_page') }}">Start free</a>
    {% endif %}
  </div>
</header>
